name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Gates never launch Electron or a browser.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # Core/shared/adapters/desktop and web run as separate jobs, so CI takes as long as the slower one.
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [core, web]
    name: ${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runners use an 8.3 temp path (RUNNER~1) that three core tests do not normalise yet; report, do not block.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # After setup-node, so `yarn` is this Node's Corepack shim (Yarn 4) and not the runner image's Yarn 1.
      - run: corepack enable
      - run: yarn --version
      # Restoring node_modules itself skips the fetch and link steps; yarn install then only verifies.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - if: matrix.suite == 'core'
        run: yarn typecheck:core
      - if: matrix.suite == 'core'
        run: yarn test:core
      # verify:web covers the web type-check, so `yarn typecheck` (which repeats it) is not run here.
      - if: matrix.suite == 'web'
        run: yarn verify:web
