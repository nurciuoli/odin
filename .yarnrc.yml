# Classic node_modules layout: apps/desktop/build/bundle.ts copies runtime packages out of node_modules,
# electron-builder reads Electron from it, and node --test runs .ts sources directly. Plug'n'Play breaks all three.
nodeLinker: node-modules
enableTelemetry: false
# Yarn 4 runs no dependency build scripts by default (enableScripts: false). Odin needs none: esbuild and the
# Claude SDK ship platform packages, and apps/desktop's own postinstall (build/ensure-electron.ts) fetches the
# Electron binary when it is missing.
